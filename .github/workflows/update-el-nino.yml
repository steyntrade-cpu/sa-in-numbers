# Weekly automatic update: fetch data, rebuild charts, publish the website.
# Turn on only after the first manual run works on your own computer.
# Runs every Monday 06:00 SAST (04:00 UTC); also runnable by hand from the
# GitHub "Actions" tab ("Run workflow").
name: Update El Nino tracker

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true          # pre-built Linux packages: much faster

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::ggplot2
            any::ggrepel
            any::dplyr
            any::readr
            any::jsonlite
            any::httr
            any::scales
            any::rvest
            any::xml2
            any::ragg
            any::knitr
            any::rmarkdown
            any::terra

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Fetch data and rebuild charts
        run: |
          Rscript update_el_nino.R
          Rscript update_sa_temperature.R

      - name: Save processed data and dam archive to the repo
        run: |
          git config user.name "sa-in-numbers-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/processed data/archive data/chirps data/sa_temperature
          git commit -m "Weekly data update $(date +%F)" || echo "No changes"
          git push

      - name: Keep social images as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: social-images
          path: outputs/

      - name: Render and publish website
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
